name: Staging Deploy

on:
  push:
    branches: [staging]
  workflow_dispatch:

permissions:
  contents: read

# Staging is the full verification gate:
# - Frontend unit/integration (Vitest server + client + storybook) + production build
# - Backend (Deno edge tests, pgTAP, concurrency scripts, db lint)
# - Deploy to deploy-svelte
# - Playwright against the live staging URL (full e2e suite — currently ~12 specs;
#   CRM journeys need E2E_* secrets; local-only auth/demo specs skip when E2E_BASE_URL is set)
#
# Vitest / Deno / pgTAP do not need the deployed host and run in parallel with deploy.
# Playwright needs a successful deploy.

jobs:
  frontend-unit:
    name: Vitest, coverage, and production build
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out staging
        uses: https://data.forgejo.org/actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: https://github.com/actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'

      - name: Enable pnpm
        run: corepack enable && corepack prepare pnpm@10 --activate

      - name: Install dependencies (lockfile)
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Chromium for Vitest browser
        run: pnpm exec playwright install chromium --with-deps

      - name: Assert no-override public env path
        run: |
          if [ -f .env ]; then
            echo "Unexpected .env present in CI checkout; removing for no-override coverage" >&2
            rm -f .env
          fi
          unset PUBLIC_API_BASE_URL
          test ! -f .env

      - name: Full Vitest (no PUBLIC_API_BASE_URL)
        env:
          PUBLIC_API_BASE_URL: ''
        run: |
          # Serialize Vitest projects so client + storybook browser servers cannot race
          # Vite/Rolldown optimizeDeps on a cold CI cache.
          pnpm exec vitest run --coverage --project server
          pnpm exec vitest run --coverage --project client
          pnpm exec vitest run --project storybook

      - name: Production SvelteKit build (no PUBLIC_API_BASE_URL)
        env:
          PUBLIC_API_BASE_URL: ''
        run: pnpm build

      - name: Storybook build (no PUBLIC_API_BASE_URL)
        env:
          PUBLIC_API_BASE_URL: ''
        run: pnpm build-storybook

      - name: svelte-check (report only)
        continue-on-error: true
        run: pnpm check

      - name: ESLint (report only)
        continue-on-error: true
        run: pnpm lint

  backend-unit:
    name: Supabase migrations, Deno, and pgTAP
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out staging
        uses: https://data.forgejo.org/actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Verify Docker daemon
        run: docker info --format '{{.ServerVersion}}'

      - name: Isolate Supabase containers and ports for this run
        run: |
          project_id="headquarters-${FORGEJO_RUN_ID}-${FORGEJO_RUN_ATTEMPT}"
          port_slot="$(((FORGEJO_RUN_ID * 10 + FORGEJO_RUN_ATTEMPT) % 10000))"
          db_port="$((40000 + port_slot))"
          shadow_port="$((50000 + port_slot))"
          sed -i "s/^project_id = .*/project_id = \"${project_id}\"/" supabase/config.toml
          sed -i "/^\[db\]$/,/^\[/ {
            s/^port = .*/port = ${db_port}/
            s/^shadow_port = .*/shadow_port = ${shadow_port}/
          }" supabase/config.toml

      - name: Install Supabase CLI
        uses: https://github.com/supabase/setup-cli@46f7f98c7f948ad727d22c1e67fab04c223a0520 # v3
        with:
          version: 2.111.0

      - name: Install Deno
        uses: https://github.com/denoland/setup-deno@667a34cdef165d8d2b2e98dde39547c9daac7282 # v2.0.5
        with:
          deno-version: 2.9.4

      - name: Report tool versions
        run: |
          supabase --version
          deno --version

      - name: Check Edge Function
        working-directory: supabase/functions/api-v1
        run: |
          deno fmt --check . ../_shared
          deno check index.ts http.test.ts
          deno lint . ../_shared

      - name: Deno unit tests (edge functions)
        working-directory: supabase/functions/api-v1
        run: |
          deno test --no-check --junit-path=deno-junit.xml --coverage=deno-coverage
          deno coverage deno-coverage

      - name: Upload Deno test report and coverage
        if: always()
        uses: https://data.forgejo.org/actions/upload-artifact@v3
        with:
          name: staging-deno-tests
          path: supabase/functions/api-v1/deno-junit.xml
          retention-days: 7

      - name: Bridge the job container to Docker-published Postgres
        run: |
          docker_host="$(
            docker inspect "$(hostname)" \
              --format '{{range .NetworkSettings.Networks}}{{println .Gateway}}{{end}}' |
              awk 'NF { print; exit }'
          )"
          db_port="$(
            awk '
              /^\[db\]$/ { in_db = 1; next }
              /^\[/ { in_db = 0 }
              in_db && /^port =/ { print $3; exit }
            ' supabase/config.toml
          )"
          nohup python3 - "${docker_host}" "${db_port}" \
            >/tmp/supabase-db-proxy.log 2>&1 <<'PY' &
          import select
          import socket
          import sys
          import threading

          host, port = sys.argv[1], int(sys.argv[2])

          def forward(client):
              try:
                  upstream = socket.create_connection((host, port))
                  peers = {client: upstream, upstream: client}
                  while peers:
                      readable, _, _ = select.select(peers, [], [])
                      for source in readable:
                          data = source.recv(65536)
                          if not data:
                              return
                          peers[source].sendall(data)
              finally:
                  client.close()
                  if "upstream" in locals():
                      upstream.close()

          with socket.create_server(("127.0.0.1", port)) as listener:
              while True:
                  client, _ = listener.accept()
                  threading.Thread(target=forward, args=(client,), daemon=True).start()
          PY
          echo "$!" >/tmp/supabase-db-proxy.pid
          sleep 1
          kill -0 "$(cat /tmp/supabase-db-proxy.pid)"

      - name: Start local database
        run: supabase db start

      - name: Replay migrations and seed from zero
        run: supabase db reset --local

      - name: Run database tests
        run: |
          test_files=(supabase/tests/*.sql)
          if [ ! -e "${test_files[0]}" ]; then
            echo "No pgTAP test files found in supabase/tests" >&2
            exit 1
          fi

          project_id="headquarters-${FORGEJO_RUN_ID}-${FORGEJO_RUN_ATTEMPT}"
          database_container="supabase_db_${project_id}"
          test_container="pgtap_${project_id}"
          database_network="$(
            docker inspect "${database_container}" \
              --format '{{range $name, $_ := .NetworkSettings.Networks}}{{println $name}}{{end}}' |
              awk 'NF { print; exit }'
          )"
          container_tests=()
          for test_file in "${test_files[@]}"; do
            container_tests+=("/tests/${test_file##*/}")
          done

          trap 'docker rm -f "${test_container}" >/dev/null 2>&1 || true' EXIT
          docker exec "${database_container}" \
            psql -U postgres -d postgres -v ON_ERROR_STOP=1 \
              -c 'create extension if not exists pgtap with schema extensions'
          docker pull ghcr.io/supabase/pg_prove:3.36
          docker create \
            --name "${test_container}" \
            --network "${database_network}" \
            --env 'PGOPTIONS=--search_path=public,extensions' \
            ghcr.io/supabase/pg_prove:3.36 \
            pg_prove \
              -d "postgresql://postgres:postgres@${database_container}:5432/postgres" \
              "${container_tests[@]}"
          docker cp supabase/tests "${test_container}:/tests"
          docker start --attach "${test_container}"

      - name: Quote document GET/save lock interleaving
        run: |
          project_id="headquarters-${FORGEJO_RUN_ID}-${FORGEJO_RUN_ATTEMPT}"
          database_container="supabase_db_${project_id}"
          chmod +x scripts/quote_document_lock_interleave.sh
          ./scripts/quote_document_lock_interleave.sh "${database_container}"

      - name: Contact primary takeover concurrency
        run: |
          project_id="headquarters-${FORGEJO_RUN_ID}-${FORGEJO_RUN_ATTEMPT}"
          database_container="supabase_db_${project_id}"
          chmod +x scripts/contact_primary_takeover_concurrency.sh
          ./scripts/contact_primary_takeover_concurrency.sh "${database_container}"

      - name: Lint database schemas
        run: >
          supabase db lint --local
          --schema public,private
          --level warning
          --fail-on error

      - name: Verify database type generation
        run: |
          supabase gen types typescript --local > /tmp/database.generated.ts
          test -s /tmp/database.generated.ts

      - name: Report local database diagnostics
        if: failure()
        run: |
          if [ -s /tmp/supabase-db-proxy.log ]; then
            cat /tmp/supabase-db-proxy.log
          fi
          docker ps -a
          container_id="$(
            docker ps -aq \
              --filter "name=^/supabase_db_headquarters-${FORGEJO_RUN_ID}-${FORGEJO_RUN_ATTEMPT}$"
          )"
          if [ -n "${container_id}" ]; then
            docker inspect "${container_id}" --format '{{json .State}}'
            docker logs "${container_id}"
          fi

      - name: Stop local Supabase
        if: always()
        run: |
          project_id="headquarters-${FORGEJO_RUN_ID}-${FORGEJO_RUN_ATTEMPT}"
          if [ -f /tmp/supabase-db-proxy.pid ]; then
            kill "$(cat /tmp/supabase-db-proxy.pid)" || true
          fi
          if ! supabase stop --no-backup; then
            docker ps -aq --filter "name=${project_id}$" |
              xargs -r docker rm -fv
            docker volume ls -q --filter "name=${project_id}$" |
              xargs -r docker volume rm
          fi

  deploy:
    name: Deploy to deploy-svelte
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Check out staging
        uses: https://data.forgejo.org/actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Install SSH key
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          set -euo pipefail
          test -n "${DEPLOY_SSH_KEY}"
          test -n "${DEPLOY_HOST}"
          install -m 700 -d "${HOME}/.ssh"
          # Forgejo secret UIs sometimes flatten PEM to one line or store literal \n.
          # Rebuild a valid OpenSSH private key and fail fast if libcrypto rejects it.
          python3 - <<'PY'
          import os, re, pathlib
          raw = os.environ["DEPLOY_SSH_KEY"]
          raw = raw.replace("\r\n", "\n").replace("\r", "\n").strip()
          if "\\n" in raw and raw.count("\n") < 3:
              raw = raw.replace("\\n", "\n")
          m = re.search(
              r"-----BEGIN OPENSSH PRIVATE KEY-----\s*(.*?)\s*-----END OPENSSH PRIVATE KEY-----",
              raw,
              re.S,
          )
          if not m:
              raise SystemExit("DEPLOY_SSH_KEY is not an OpenSSH private key PEM")
          body = re.sub(r"\s+", "", m.group(1))
          lines = [body[i : i + 70] for i in range(0, len(body), 70)]
          key = (
              "-----BEGIN OPENSSH PRIVATE KEY-----\n"
              + "\n".join(lines)
              + "\n-----END OPENSSH PRIVATE KEY-----\n"
          )
          path = pathlib.Path.home() / ".ssh" / "deploy_key"
          path.write_text(key)
          path.chmod(0o600)
          PY
          ssh-keygen -y -f "${HOME}/.ssh/deploy_key" >/dev/null
          ssh-keyscan -H "${DEPLOY_HOST}" >> "${HOME}/.ssh/known_hosts"

      - name: Sync deploy script and run remote staging deploy
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_SHA: ${{ forgejo.sha }}
        run: |
          set -euo pipefail
          test -n "${DEPLOY_HOST}"
          test -n "${DEPLOY_USER}"
          REMOTE_APP="/home/deploy/apps/headquarters"
          REMOTE_SCRIPT="/tmp/staging-remote-deploy.sh"
          # Copy to /tmp — not into APP_DIR — so we do not dirty the git worktree
          # before the script runs checkout/reset.
          scp -i "${HOME}/.ssh/deploy_key" \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            scripts/staging-remote-deploy.sh \
            "${DEPLOY_USER}@${DEPLOY_HOST}:${REMOTE_SCRIPT}"
          ssh -i "${HOME}/.ssh/deploy_key" \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            "${DEPLOY_USER}@${DEPLOY_HOST}" \
            "chmod +x '${REMOTE_SCRIPT}' && \
             APP_DIR='${REMOTE_APP}' \
             BRANCH='staging' \
             DEPLOY_SHA='${DEPLOY_SHA}' \
             APP_HOST='${DEPLOY_HOST}' \
             '${REMOTE_SCRIPT}'"

  playwright-staging:
    name: Verify deployed staging with Playwright
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out deployed staging revision
        uses: https://data.forgejo.org/actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Require E2E secrets
        env:
          E2E_BASE_URL: ${{ secrets.E2E_BASE_URL }}
          E2E_SUPABASE_URL: ${{ secrets.E2E_SUPABASE_URL }}
          E2E_SUPABASE_ANON_KEY: ${{ secrets.E2E_SUPABASE_ANON_KEY }}
        run: |
          missing=0
          for key in E2E_BASE_URL E2E_SUPABASE_URL E2E_SUPABASE_ANON_KEY; do
            if [ -z "${!key}" ]; then
              echo "::error::Missing Forgejo secret $key"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            echo "Add E2E_BASE_URL, E2E_SUPABASE_URL, E2E_SUPABASE_ANON_KEY on the repo, then re-run."
            exit 1
          fi
          echo "E2E_BASE_URL host: $(printf '%s' "$E2E_BASE_URL" | sed -E 's#https?://##' | cut -d/ -f1)"

      - name: Setup Node.js
        uses: https://github.com/actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'

      - name: Enable pnpm
        run: corepack enable && corepack prepare pnpm@10 --activate

      - name: Install dependencies (lockfile)
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Chromium
        run: pnpm exec playwright install chromium --with-deps

      - name: Run CRM Playwright suite against deployed staging
        env:
          CI: 'true'
          E2E_BASE_URL: ${{ secrets.E2E_BASE_URL }}
          E2E_SUPABASE_URL: ${{ secrets.E2E_SUPABASE_URL }}
          E2E_SUPABASE_ANON_KEY: ${{ secrets.E2E_SUPABASE_ANON_KEY }}
          E2E_USER_EMAIL: ${{ secrets.E2E_USER_EMAIL }}
          E2E_USER_PASSWORD: ${{ secrets.E2E_USER_PASSWORD }}
          E2E_ORG_ID: ${{ secrets.E2E_ORG_ID }}
        run: pnpm exec playwright test

      - name: Upload Playwright report
        if: failure()
        uses: https://data.forgejo.org/actions/upload-artifact@v3
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          retention-days: 7
