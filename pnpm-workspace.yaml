packages:
  - '.'

# pnpm >= 10.26 / 11 read `allowBuilds`; the pinned pnpm@10.15.1 (packageManager)
# only understands `onlyBuiltDependencies`. Keep both lists in sync.
allowBuilds:
  '@tailwindcss/oxide': true
  esbuild: true

onlyBuiltDependencies:
  - '@tailwindcss/oxide'
  - esbuild

# Security floors for transitive deps whose parents pin vulnerable ranges
# (`pnpm audit`). Drop an entry once the parents ship patched versions.
overrides:
  'devalue@<5.9.2': ^5.9.2
  'brace-expansion@>=4.0.0 <5.0.12': ^5.0.12
  'nanoid@<3.3.18': ^3.3.18
  'joi@>=16.0.0 <17.13.7': ^17.13.7
